<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Buscador de Libros</h1>
        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Ej: The Lord of the Rings">
            <button id="btnBuscar">Buscar</button>
        </div>
        <p id="msgError" style="color: red; display: none;"></p>
        <div id="resultados" class="grid-libros"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
