<!DOCTYPE html>
<head>
    <title>Formularios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form>
        <div class="form-grupo">
            <label for="nombre">Ingrese su nombre:</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Martinez" required minlength="3">
        </div>
        <div class="form-grupo">
            <label for="correo">Ingrese correo electronico:</label>
            <input type="email" id="correo" name="email" placeholder="Ej: example@gmail.com" required>
        </div>
        <button type="submit">Enviar formulario</button>
    </form>
</body>
</html>
