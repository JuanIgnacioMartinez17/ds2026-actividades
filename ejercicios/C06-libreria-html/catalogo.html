<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Librería - Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">📖 Librería</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="catalogo.html">Catálogo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacto.html">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <h2 class="mb-4">Catálogo de Libros</h2>

      <form id="form-busqueda" class="mb-4">
        <div class="row g-2 align-items-end">
          <div class="col-sm-9">
            <label for="input-busqueda" class="form-label">Título, autor o tema</label>
            <input
              type="text"
              class="form-control form-control-lg"
              id="input-busqueda"
              placeholder="Ej: Harry Potter, Borges, ciencia ficción..."
              required
            >
          </div>
          <div class="col-sm-3">
            <button type="submit" class="btn btn-dark btn-lg w-100">Buscar</button>
          </div>
        </div>
      </form>

      <p class="text-muted" id="contador-resultados"></p>

      <div id="spinner" style="display:none;" class="text-center my-4">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2 text-muted">Buscando en Open Library...</p>
      </div>

      <div class="row g-4" id="resultados"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
  </body>
</html>
