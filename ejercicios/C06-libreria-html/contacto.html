<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Librería - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">📖 Librería</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="catalogo.html">Catálogo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contacto.html">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h2 class="mb-4">Contacto</h2>
 
          <form id="form-contacto" novalidate>
 
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre"
                     placeholder="Tu nombre completo" required>
              <div class="invalid-feedback">El nombre es obligatorio.</div>
            </div>
 
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email"
                     placeholder="tu@email.com" required>
              <div class="invalid-feedback">Ingresá un email válido.</div>
            </div>

            <div class="mb-3">
              <label for="asunto" class="form-label">Asunto</label>
              <select class="form-select" id="asunto" required>
                <option value="">— Seleccioná un asunto —</option>
                <option value="consulta">Consulta</option>
                <option value="reclamo">Reclamo</option>
                <option value="sugerencia">Sugerencia</option>
              </select>
              <div class="invalid-feedback">Seleccioná un asunto.</div>
            </div>

            <div class="mb-4">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea class="form-control" id="mensaje" rows="5"
                        placeholder="Escribí tu mensaje acá..." required></textarea>
              <div class="invalid-feedback">El mensaje es obligatorio.</div>
            </div>
 
            <button type="submit" class="btn btn-dark btn-lg w-100">Enviar mensaje</button>
 
          </form>
 
          <div id="alerta-exito" class="alert alert-success mt-4" style="display:none;">
            ✅ ¡Mensaje enviado! Nos pondremos en contacto a la brevedad.
          </div>
 
        </div>
      </div>
    </div>
 
    <script>
      document.getElementById("form-contacto").addEventListener("submit", function(e) {
        e.preventDefault();
 
        this.classList.add("was-validated");
 
        if (!this.checkValidity()) return;

        this.style.display = "none";
        document.getElementById("alerta-exito").style.display = "block";
      });
    </script>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
  </body>
</html>
